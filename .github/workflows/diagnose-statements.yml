name: Inspect retained statement inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _pipeline/requirements-refresh.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            _pipeline/data/cache/brief
            _pipeline/data/cache/capital
          key: inspect-${{ github.run_id }}
          restore-keys: brief-statements-${{ github.repository_id }}-
      - name: Inspect public data only without acquisition or mutation
        env:
          PYTHONPATH: _pipeline
        shell: python
        run: |
          import json,pathlib,yaml
          from smartoptions.brief.company import company,facts,sector_medians
          root=pathlib.Path('.');core=json.loads((root/'data/core.json').read_text())
          cfg=yaml.safe_load((root/'_pipeline/config/brief.yaml').read_text())['company']
          seed=json.loads((root/'_pipeline/fixtures/analyst-statements-20261018.json').read_text())['records']
          report={}
          for t in ['CHD','CHRW','FLEX']:
              row=next(r for r in core['rows'] if r['t']==t)
              records={}
              for n in ['income_stmt','quarterly_income_stmt','cashflow','quarterly_cashflow','balance_sheet','quarterly_balance_sheet','eps_revisions','earnings_estimate']:
                  p=root/'_pipeline/data/cache/brief'/(t+'.'+n+'.json')
                  records[n]=json.loads(p.read_text()) if p.exists() else {}
              obj=company(row,records,core['asof_session'],cfg,sector_medians(core['rows']))
              old=json.loads((root/'data/brief/company'/(t+'.json')).read_text())
              report[t]={'facts':facts(row,records,core['asof_session'],cfg),'new_card':obj['cards']['resilience'],'old_card':old['cards']['resilience'],
                         'raw':{n:records[n] for n in ['quarterly_balance_sheet','quarterly_income_stmt']},
                         'seed':{n:seed[t+'.'+n+'.json'] for n in ['quarterly_balance_sheet','quarterly_income_stmt']}}
          pathlib.Path('statement-diagnostic.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({t:{k:v for k,v in r.items() if k in ['facts','new_card']} for t,r in report.items()},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: statement-diagnostic-${{ github.run_id }}
          path: statement-diagnostic.json
          retention-days: 7
