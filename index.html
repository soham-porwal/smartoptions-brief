<body>
<header id="hdr">
  <div class="brand">SmartOptions <span class="dim">V2</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="markets" class="on">Markets</button>
    <button data-tab="macro">Macro</button>
  </nav>
  <div class="hstat" id="hstat"></div>
  <div class="hsel">
    <select id="wfSel" title="Workflow: a built-in screen + step checklist"></select>
    <select id="wsSel" title="Saved workspaces (Settings to save)"></select>
  </div>
  <div class="hbtns">
    <button id="btnSettings" title="Settings: panels, columns, tape, display, workspaces">Settings</button>
    <button id="btnControls" title="Controls: scenario + screen thresholds">Controls</button>
    <button id="btnAbout" title="Methods, sources, limitations">About</button>
  </div>
</header>
<div id="tape" class="tape"></div>
<div id="wfstrip" class="wfstrip" hidden></div>

<main id="pg-markets" class="page">
  <section id="left" class="pane">
    <div class="ptools">
      <input id="q" type="search" placeholder="Search ticker / name / sector" autocomplete="off" spellcheck="false">
      <div class="chips" id="chips"></div>
    </div>
    <div class="tmeta" id="tmeta"></div>
    <div class="twrap" id="twrap"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <section id="center" class="pane">
    <div class="ctools">
      <div class="ctitle" id="ctitle"></div>
      <div class="cbtns" id="ranges"></div>
      <label class="ovl">vs <select id="overlay"></select></label>
    </div>
    <div class="clegend" id="clegend"></div>
    <div id="chart"></div>
    <div class="evstrip" id="evstrip"></div>
    <div class="sigs">
      <div class="sech">Signals <span class="dim">click to chart</span></div>
      <div id="signals"></div>
    </div>
  </section>
  <section id="right" class="pane"><div id="detail"></div></section>
</main>

<main id="pg-macro" class="page" hidden>
  <section class="mgrid-wrap">
    <div id="mgrid"></div>
  </section>
  <section class="mside">
    <div id="mhm"><div class="sech">Sector x factor <span class="dim" id="hmnote"></span></div>
    <div id="heatmap"></div></div>
    <div id="mcal"><div class="sech">Calendar</div>
    <div id="cal"></div></div>
  </section>
</main>

<aside id="controls" class="drawer" hidden></aside>
<aside id="about" class="drawer wide" hidden></aside>
<aside id="settings" class="drawer" hidden></aside>
<div id="tip" hidden></div>
